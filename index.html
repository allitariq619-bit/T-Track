<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTrack</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 40px 20px;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 20px auto;
      background: #111;
      color: white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #666;
    }

    a {
      display: block;
      padding: 16px;
      margin: 14px 0;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      border: 1px solid #ddd;
    }

    a:hover {
      background: #eee;
    }

    .footer {
      margin-top: 30px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">T</div>

    <h1>TTrack</h1>

    <p>Welcome to TTrack</p>

    <a href="https://instagram.com/" target="_blank">
      Instagram
    </a>

    <a href="https://youtube.com/" target="_blank">
      YouTube
    </a>

    <a href="https://facebook.com/" target="_blank">
      Facebook
    </a>

    <a href="https://wa.me/" target="_blank">
      WhatsApp
    </a>

    <div class="footer">
      © 2026 TTrack
    </div>

  </div>

</body>
</html>
